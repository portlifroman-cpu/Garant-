<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>GARANT — Product Catalogue Spain</title>
<style>
:root{--gold:#c7a338;--ink:#0b0b0b;--muted:#717171;--line:#e9e4d6;--paper:#fff;--soft:#faf8f2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#ece9df}
.wrap{max-width:1120px;margin:auto;padding:18px}
.cover,.back{min-height:68vh;border-radius:28px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:
 radial-gradient(circle at 10% 0%,rgba(220,184,50,.55),transparent 28%),
 radial-gradient(circle at 90% 100%,rgba(218,179,44,.52),transparent 30%),
 #030303;box-shadow:0 18px 55px rgba(0,0,0,.18)}
.cover-inner,.back-inner{padding:55px 24px;max-width:760px}
.logo{width:min(470px,82vw);height:auto;filter:brightness(0) invert(1)}
.cover h1{font-size:clamp(25px,4vw,44px);letter-spacing:.28em;margin:22px 0 0;font-weight:600}
.cover p{font-size:15px;letter-spacing:.22em;color:#ddd}
.section{margin:22px 0;background:var(--paper);border-radius:26px;padding:24px;box-shadow:0 12px 35px rgba(35,30,15,.08)}
.section-title{text-align:center;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(24px,4vw,40px);margin:2px 0 6px}
.section-sub{text-align:center;color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;min-height:245px;border:1px solid var(--line);border-radius:20px;padding:18px 126px 18px 18px;background:linear-gradient(145deg,#fff,#fbfaf6);overflow:hidden}
.card img{position:absolute;right:12px;top:54%;transform:translateY(-45%);width:108px;height:108px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.16))}
.card h3{font-size:19px;margin:0 0 10px;line-height:1.15}
.meta{font-size:14px;line-height:1.5;color:#666}
.price{font-size:21px;font-weight:800;margin-top:12px}
.badge{display:inline-block;border:1px solid var(--gold);border-radius:999px;padding:4px 9px;font-size:12px;margin-bottom:8px;color:#6f5811;background:#fffaf0}
.back{min-height:520px;margin-top:22px}
.back h2{font-size:26px;letter-spacing:.18em;margin:18px 0 24px}
.contact{line-height:1.8;color:#f0f0f0}
.qr{width:180px;height:180px;background:#fff;padding:10px;border-radius:16px;margin:26px auto 12px;display:block}
.site{font-weight:800;font-size:19px}
.toolbar{position:sticky;top:8px;z-index:10;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 auto 14px}
.toolbar button,.toolbar a{border:0;border-radius:12px;padding:10px 14px;font-weight:700;text-decoration:none;background:#111;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.toolbar .light{background:#fff;color:#111}
.empty{text-align:center;padding:30px;color:#777}
@media(max-width:820px){.wrap{padding:10px}.grid{grid-template-columns:1fr 1fr}.card{min-height:220px;padding-right:112px}.card img{width:94px;height:94px}.section{padding:15px}.cover,.back{border-radius:20px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.card{min-height:205px}.cover{min-height:58vh}.section-title{letter-spacing:.11em}}
@media print{body{background:#fff}.toolbar{display:none}.wrap{max-width:none;padding:0}.cover,.section,.back{box-shadow:none;break-inside:avoid;margin:0 0 12px;border-radius:0}}
</style>
</head>

</div>
<script>
const ENDPOINT='https://bxibrptyonhxcdnizacp.supabase.co/functions/v1/public-catalog-products';
const PRODUCT_IMAGE_PROXY='https://bxibrptyonhxcdnizacp.supabase.co/functions/v1/official-garant-product-image';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const order=['Garant Prime Collection','Prime Collection','Classic Edition','Main line','Extreme Edition','Extreme','Mini Pouches','Chewing bags','Tobacco Chew Bags','Nicotine strips','Nicotine Strips'];
function normCategory(x){
  const c=(x.category||'Otros').trim();
  if(/prime/i.test(c))return 'PRIME COLLECTION';
  if(/extreme/i.test(c))return 'EXTREME EDITION';
  if(/mini/i.test(c))return 'MINI POUCHES';
  if(/chew/i.test(c))return 'TOBACCO CHEW BAGS';
  if(/strip/i.test(c))return 'NICOTINE STRIPS';
  if(/main|classic/i.test(c))return 'CLASSIC EDITION';
  return c.toUpperCase();
}
function productCard(x){
  const img=x.image_url||(x.source_url?PRODUCT_IMAGE_PROXY+'?url='+encodeURIComponent(x.source_url):'');
  return `<article class="card">
    <span class="badge">${esc(normCategory(x))}</span>
    <h3>${esc(x.name)}</h3>
    ${img?'<img src="'+esc(img)+'" alt="'+esc(x.name)+'" loading="lazy" onerror="this.style.display=\'none\'">':''}
    <div class="meta">
      ${x.flavor?'<div>Sabor: '+esc(x.flavor)+'</div>':''}
      ${x.strength?'<div>Intensidad: '+esc(x.strength)+'</div>':''}
      ${x.nicotine_mg_pouch?'<div>Nicotina: '+esc(x.nicotine_mg_pouch)+' mg/pouch</div>':''}
      ${x.nicotine_mg_g?'<div>'+esc(x.nicotine_mg_g)+' mg/g</div>':''}
      ${x.pouches_per_can?'<div>'+esc(x.pouches_per_can)+' pouches</div>':''}
      ${x.total_weight_g?'<div>Peso: '+esc(x.total_weight_g)+' g</div>':''}
    </div>
    ${x.price>0?'<div class="price">'+Number(x.price).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €</div>':''}
  </article>`;
}
(async()=>{
 const root=document.getElementById('sections');
 try{
   const r=await fetch(ENDPOINT);
   const j=await r.json();
   const products=Array.isArray(j.products)?j.products:[];
   if(!products.length){root.innerHTML='<div class="section empty">El catálogo está vacío.</div>';return}
   const groups={};
   for(const p of products){const k=normCategory(p);(groups[k]??=[]).push(p)}
   const preferred=['PRIME COLLECTION','CLASSIC EDITION','EXTREME EDITION','MINI POUCHES','TOBACCO CHEW BAGS','NICOTINE STRIPS'];
   const keys=[...preferred.filter(k=>groups[k]),...Object.keys(groups).filter(k=>!preferred.includes(k)).sort()];
   root.innerHTML=keys.map(k=>`<section class="section"><h2 class="section-title">${esc(k)}</h2><p class="section-sub">${groups[k].length} productos</p><div class="grid">${groups[k].map(productCard).join('')}</div></section>`).join('');
 }catch(e){root.innerHTML='<div class="section empty">No se pudo cargar el catálogo. Actualiza la página.</div>'}
})();
</script>
