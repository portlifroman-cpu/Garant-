const app=document.getElementById('app');
let token=localStorage.getItem('garant_accounting_token')||'';
let user=null, company=null, tab='overview';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function req(path,opt={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 if(token) headers.Authorization='Bearer '+token;
 const r=await fetch(URL+path,Object.assign({},opt,{headers}));
 const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{data=text}
 if(!r.ok) throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||('HTTP '+r.status));
 return data;
}
function login(msg=''){app.innerHTML='<div class="wrap"><div class="card login"><div class="brand"><img class="main-brand-logo" src="'+LOGO_DATA+'" alt="GARANT PG NORD"><div><h1>Бухгалтерия</h1><div class="muted">PG Nord Garant S.L.</div></div></div>'+(msg?'<div class="notice">'+esc(msg)+'</div>':'')+'<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"></div><button id="signin" class="btn primary full">Войти</button><button id="reg" class="btn full">Создать аккаунт</button></div></div>';document.getElementById('signin').onclick=signin;document.getElementById('reg').onclick=register}
async function signin(){
 const email=document.getElementById('email').value.trim(), password=document.getElementById('pass').value;
 if(!email||!password)return login('Введите email и пароль.');
 const btn=document.getElementById('signin');
 if(btn){btn.disabled=true;btn.textContent='Входим…';}
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),45000);
 try{
   const headers={'apikey':KEY,'Content-Type':'application/json'};
   const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers,body:JSON.stringify({email,password}),signal:controller.signal});
   const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch{d={}}
   if(!r.ok)throw new Error((d&&d.msg)||(d&&d.error_description)||(d&&d.message)||('HTTP '+r.status));
   token=d.access_token;
   localStorage.setItem('garant_accounting_token',token);
   await boot();
 }catch(e){
   if(e.name==='AbortError')login('Сервер входа отвечает слишком долго. Попробуйте ещё раз через несколько секунд.');
   else login('Ошибка входа: '+e.message);
 }finally{clearTimeout(timer)}
}
function register(){app.innerHTML='<div class="wrap"><div class="card login"><h1>Регистрация</h1><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Пароль</label><input id="rp" type="password"></div><div class="field"><label>Повторите пароль</label><input id="rp2" type="password"></div><button id="do" class="btn primary full">Зарегистрироваться</button><button id="back" class="btn full">Назад</button></div></div>';document.getElementById('back').onclick=()=>login();document.getElementById('do').onclick=signup}
async function signup(){const email=document.getElementById('re').value.trim(),p=document.getElementById('rp').value,p2=document.getElementById('rp2').value;if(!email.includes('@'))return alert('Введите корректный email');if(p.length<6)return alert('Пароль минимум 6 символов');if(p!==p2)return alert('Пароли не совпадают');try{await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:p,data:{},gotrue_meta_security:{captcha_token:''}})});login('Аккаунт создан. Если email уже подтверждён — просто войдите. Если придёт письмо, подтвердите адрес.')}catch(e){login('Ошибка регистрации: '+e.message)}}
async function boot(){
 if(!token)return login();
 try{user=await req('/auth/v1/user');}
 catch(e){localStorage.removeItem('garant_accounting_token');token='';return login('Сессия истекла. Войдите снова.')}
 try{
   const cs=await req('/rest/v1/companies?select=*&limit=1');
   company=cs&&cs[0];
   if(!company)return setup();
   render();
 }catch(e){login('Ошибка загрузки данных: '+e.message)}
}
function setup(){app.innerHTML='<div class="wrap"><div class="card login"><h1>Первичная настройка</h1><div class="field"><label>Компания</label><input id="cn" value="PG Nord Garant S.L."></div><div class="field"><label>NIF</label><input id="tx" value="B26984146"></div><button id="create" class="btn primary full">Создать компанию</button></div></div>';document.getElementById('create').onclick=createCompany}
async function createCompany(){try{const rows=await req('/rest/v1/companies',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:'GARANT',legal_name:document.getElementById('cn').value,tax_id:document.getElementById('tx').value,created_by:user.id})});company=rows[0];await req('/rest/v1/memberships',{method:'POST',body:JSON.stringify({company_id:company.id,user_id:user.id,role:'owner'})});await req('/rest/v1/warehouses',{method:'POST',body:JSON.stringify({company_id:company.id,name:'Главный склад',type:'main'})});render()}catch(e){alert(e.message)}}

function nextInvoiceNumber(existing){
 const now=new Date(), dd=String(now.getDate()).padStart(2,'0'), mm=String(now.getMonth()+1).padStart(2,'0'), yy=String(now.getFullYear()).slice(-2);
 const prefix=dd+'-'+mm+yy+'/';
 let max=0;(existing||[]).forEach(x=>{if((x.number||'').startsWith(prefix)){const n=parseInt((x.number||'').split('/').pop(),10);if(n>max)max=n}});
 return prefix+String(max+1).padStart(2,'0');
}
async function openInvoiceForm(withRecargo=false,editId=null){
 try{
   const baseReqs=[
     req('/rest/v1/counterparties?select=*&company_id=eq.'+company.id+'&type=in.(customer,both)&order=name'),
     req('/rest/v1/products?select=id,name,flavor,sale_price,vat_rate&company_id=eq.'+company.id+'&active=eq.true&order=flavor'),
     req('/rest/v1/invoices?select=number&company_id=eq.'+company.id+'&direction=eq.sale'),
     req('/rest/v1/warehouses?select=id,name,type&company_id=eq.'+company.id+'&order=created_at.asc')
   ];
   if(editId){
     baseReqs.push(req('/rest/v1/invoices?select=*&id=eq.'+editId+'&limit=1'));
     baseReqs.push(req('/rest/v1/invoice_items?select=*&invoice_id=eq.'+editId+'&order=id.asc'));
   }
   const data=await Promise.all(baseReqs);
   const clients=data[0],products=data[1],existing=data[2],warehouses=data[3];
   const current=editId?(data[4]&&data[4][0]):null;
   const currentItems=editId?(data[5]||[]):[];
   if(editId&&!current)return alert('Счёт не найден.');
   if(!clients.length)return alert('Сначала добавьте клиента в разделе «Клиенты».');
   if(!products.length)return alert('Нет товаров для счёта.');
   const mainWarehouse=warehouses.find(w=>w.type==='main')||warehouses[0];
   if(!mainWarehouse)return alert('Нет склада.');
   if(editId)withRecargo=Number(current.recargo_rate||0)>0;

   const number=editId?(current.number||''):nextInvoiceNumber(existing);
   const today=editId?(current.invoice_date||''):new Date().toISOString().slice(0,10);
   const modal=document.createElement('div');modal.className='inv-modal';
   modal.innerHTML='<div class="inv-panel"><div class="top"><div style="display:flex;gap:18px;align-items:center"><img class="invoice-brand-logo" src="'+LOGO_DATA+'" alt="GARANT PG NORD"><div><h2 style="margin:0">'+(editId?'Редактировать '+(withRecargo?'Recargo':'Factura'):(withRecargo?'Recargo':'Factura'))+'</h2><div class="muted">'+(withRecargo?'Фактура с Recargo':'Обычная фактура')+'</div></div></div><button id="invclose" class="btn">×</button></div>'+
   '<div class="inv-grid"><div class="field"><label>Клиент</label><select id="invclient">'+clients.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>№ Factura</label><input id="invnumber" value="'+esc(number)+'"></div><div class="field"><label>Fecha</label><input id="invdate" type="date" value="'+today+'"></div><div class="field"><label>Forma de Pago</label><select id="invpay"><option value="cash">En efectivo</option><option value="bank">Transferencia bancaria</option><option value="card">Tarjeta</option><option value="other">Otro</option></select></div><div class="field"><label>IVA</label><input id="invat" type="number" step="0.1" value="21"></div>'+(withRecargo?'<div class="field"><label>Recargo de equivalencia</label><input id="invrec" type="number" step="0.1" value="'+Number(current?.recargo_rate||5.2)+'"></div>':'')+'</div>'+
   '<div style="margin-top:12px"><b>Mercancía</b><div id="invlines"></div><button id="addline" class="btn">+ Добавить позицию</button></div>'+
   '<div class="inv-summary"><span>Subtotal</span><b id="sumsub">0,00 €</b><span>IVA</span><b id="sumiva">0,00 €</b>'+(withRecargo?'<span>Recargo</span><b id="sumrec">0,00 €</b>':'')+'<span class="grand">TOTAL</span><b class="grand" id="sumtotal">0,00 €</b></div>'+
   '<div class="invoice-actions" style="justify-content:flex-end;margin-top:16px"><button id="previewinvoice" class="btn">Предпросмотр</button><button id="saveinvoice" class="btn invoice-btn">'+(editId?'Сохранить изменения':'Сохранить счёт')+'</button></div></div>';
   document.body.appendChild(modal);

   if(current){
     modal.querySelector('#invclient').value=current.counterparty_id||'';
     modal.querySelector('#invpay').value=current.payment_method||'other';
     const firstItem=currentItems.find(x=>x.product_id);
     if(firstItem)modal.querySelector('#invat').value=Number(firstItem.vat_rate||21);
   }

   const lines=modal.querySelector('#invlines');
   function addLine(item=null){
     const row=document.createElement('div');row.className='inv-line';
     row.innerHTML='<div class="field"><label>Товар</label><select class="lp">'+products.map(p=>'<option value="'+p.id+'" data-price="'+Number(p.sale_price||0)+'">'+esc((p.flavor||p.name))+'</option>').join('')+'</select></div><div class="field"><label>Cantidad</label><input class="lq" type="number" min="1" step="1" value="'+Number(item?.quantity||1)+'"></div><div class="field"><label>Precio unidad</label><input class="lu" type="number" min="0" step="0.01" value="'+Number(item?.unit_price??products[0].sale_price??0).toFixed(2)+'"></div><button class="btn lr">×</button>';
     lines.appendChild(row);
     const sel=row.querySelector('.lp'),price=row.querySelector('.lu');
     if(item?.product_id&&products.some(p=>p.id===item.product_id))sel.value=item.product_id;
     sel.onchange=()=>{price.value=Number(sel.selectedOptions[0].dataset.price||0).toFixed(2);recalc()};
     row.querySelector('.lq').oninput=recalc;price.oninput=recalc;row.querySelector('.lr').onclick=()=>{row.remove();recalc()};recalc();
   }
   function recalc(){
     let sub=0;modal.querySelectorAll('.inv-line').forEach(r=>sub+=Number(r.querySelector('.lq').value||0)*Number(r.querySelector('.lu').value||0));
     const vr=Number(modal.querySelector('#invat').value||0),rr=withRecargo?Number(modal.querySelector('#invrec')?.value||5.2):0,iva=sub*vr/100,rec=withRecargo?sub*rr/100:0,total=sub+iva+rec;
     modal.querySelector('#sumsub').textContent=money(sub);modal.querySelector('#sumiva').textContent=money(iva);if(modal.querySelector('#sumrec'))modal.querySelector('#sumrec').textContent=money(rec);modal.querySelector('#sumtotal').textContent=money(total);
     return {sub,vr,rr,iva,rec,total};
   }
   modal.querySelector('#invat').oninput=recalc;if(modal.querySelector('#invrec'))modal.querySelector('#invrec').oninput=recalc;
   modal.querySelector('#addline').onclick=()=>addLine();modal.querySelector('#invclose').onclick=()=>modal.remove();

   if(editId&&currentItems.length){
     currentItems.filter(i=>i.product_id).forEach(i=>addLine(i));
   }else addLine();

   modal.querySelector('#previewinvoice').onclick=()=>{const pack=collect();if(pack)showInvoicePaper(pack,false)};
   modal.querySelector('#saveinvoice').onclick=async()=>{
     const pack=collect();if(!pack)return;
     try{
       let invId=editId;
       if(editId){
         await req('/rest/v1/stock_movements?reference_id=eq.'+encodeURIComponent(editId),{method:'DELETE'});
         await req('/rest/v1/invoice_items?invoice_id=eq.'+encodeURIComponent(editId),{method:'DELETE'});
         await req('/rest/v1/invoices?id=eq.'+encodeURIComponent(editId),{
           method:'PATCH',
           headers:{Prefer:'return=representation'},
           body:JSON.stringify({
             counterparty_id:pack.client.id,number:pack.number,status:current.status||'issued',
             invoice_date:pack.date,subtotal:pack.totals.sub,vat_total:pack.totals.iva,
             recargo_rate:pack.totals.rr,recargo_total:pack.totals.rec,total:pack.totals.total,
             paid_total:Number(current.paid_total||0),payment_method:pack.payment,
             notes:(withRecargo?'Recargo':null)
           })
         });
       }else{
         const invRows=await req('/rest/v1/invoices',{
           method:'POST',headers:{Prefer:'return=representation'},
           body:JSON.stringify({
             company_id:company.id,counterparty_id:pack.client.id,direction:'sale',number:pack.number,
             status:'issued',invoice_date:pack.date,subtotal:pack.totals.sub,vat_total:pack.totals.iva,
             recargo_rate:pack.totals.rr,recargo_total:pack.totals.rec,total:pack.totals.total,
             paid_total:0,payment_method:pack.payment,notes:(withRecargo?'Recargo':null),created_by:user.id
           })
         });
         invId=invRows[0].id;
       }

       await req('/rest/v1/invoice_items',{
         method:'POST',
         body:JSON.stringify(pack.items.map(i=>({
           company_id:company.id,invoice_id:invId,product_id:i.product_id,description:i.description,
           quantity:i.quantity,unit_price:i.unit_price,vat_rate:pack.totals.vr,excise_per_unit:0,
           line_subtotal:i.subtotal,line_vat:i.subtotal*pack.totals.vr/100,line_excise:0,
           line_total:i.subtotal*(1+pack.totals.vr/100)
         })))
       });

       await req('/rest/v1/stock_movements',{
         method:'POST',
         body:JSON.stringify(pack.items.map(i=>({
           company_id:company.id,product_id:i.product_id,warehouse_id:mainWarehouse.id,
           movement_type:'out',quantity:i.quantity,reference_type:'invoice',reference_id:invId,
           note:'Продажа по счёту '+pack.number,movement_at:pack.date+'T12:00:00+00:00',created_by:user.id
         })))
       });

       modal.remove();
       showInvoicePaper(Object.assign(pack,{id:invId}),true);
       loadTab();
     }catch(e){alert('Не удалось сохранить счёт: '+e.message)}
   };

   const refresh=()=>{if(!psel||!qinp||!out)return;const p=products.find(x=>x.id===psel.value);const q=Number(qinp.value||0);const g=q*Number(p?.unit_weight_g||0);out.textContent=g?('Вес: '+g.toLocaleString('ru-RU')+' г ('+(g/1000).toLocaleString('ru-RU',{maximumFractionDigits:3})+' кг)'):'У товара не указан вес одной банки';};
   if(psel)psel.onchange=refresh;if(qinp)qinp.oninput=refresh;refresh();
 },0);
}
boot();
})();
</script></body></html>
