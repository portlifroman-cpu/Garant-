<style>

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product-card{position:relative;min-height:225px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px 112px 16px 16px;overflow:hidden}.product-card img{position:absolute;right:12px;top:54%;transform:translateY(-42%);width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 7px 12px rgba(0,0,0,.15))}.product-card h3{margin:0 0 8px;font-size:16px}.product-meta{font-size:13px;color:#6b7280;line-height:1.45}.kpi b{font-size:26px;display:block;margin-top:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid #eef0f3;text-align:left;font-size:14px}.table th{font-size:12px;color:#6b7280}
.invoice-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.invoice-btn{background:#0a5c73;color:#fff}.danger-btn{background:#fee2e2;color:#991b1b}.danger-btn:hover{background:#fecaca}.status-ok{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.status-wait{display:inline-block;padding:4px 8px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:700}.staff-actions{display:flex;gap:6px;flex-wrap:wrap}.staff-role{padding:8px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.inv-modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:12px;z-index:10000}.inv-panel{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.inv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.inv-line{display:grid;grid-template-columns:2fr .65fr .8fr 42px;gap:8px;align-items:end;margin:8px 0}.inv-line select,.inv-line input,.inv-panel select,.inv-panel input{width:100%;padding:10px;border:1px solid #cfd8df;border-radius:10px;background:#fff}.inv-summary{margin-left:auto;width:min(360px,100%);display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding-top:12px}.inv-summary .grand{font-weight:800;font-size:18px}.invoice-paper{background:#fff;color:#111;font-family:Arial,sans-serif;max-width:850px;margin:0 auto;padding:26px}.invoice-head{display:grid;grid-template-columns:1.4fr .8fr;gap:26px;align-items:start}.invoice-title{color:#0a5c73;font-size:22px;font-weight:800;border-bottom:4px solid #0a5c73;padding-bottom:6px;margin:18px 0}.invoice-client-label,.invoice-pay-label{display:inline-block;color:#0a5c73;font-weight:700;border-bottom:3px solid #0a5c73;padding:0 26px 4px 2px}.invoice-box{border:1px solid #333}.invoice-box div{display:flex;justify-content:space-between;gap:16px;padding:5px 8px;border-bottom:1px solid #aaa}.invoice-box div:last-child{border-bottom:0}.invoice-table{width:100%;border-collapse:collapse;margin-top:14px;border:2px solid #222}.invoice-table th,.invoice-table td{border-right:1px solid #222;padding:7px 5px}.invoice-table th{color:#0a5c73;border-bottom:2px solid #222}.invoice-table th:last-child,.invoice-table td:last-child{border-right:0}.invoice-table .amount{text-align:right}.invoice-total-box{margin-left:auto;width:310px;border-collapse:collapse}.invoice-total-box td{padding:5px 8px;border-bottom:1px solid #222}.invoice-total-box td:last-child{text-align:right;background:#f1eff8;border-left:1px solid #222}.invoice-footer{display:flex;justify-content:space-between;gap:24px;border-bottom:4px solid #0a5c73;padding-bottom:16px;margin-top:8px}.invoice-sign{text-align:right;margin-top:34px;font-style:italic}
@media(max-width:760px){.inv-grid{grid-template-columns:1fr}.expense-grid{grid-template-columns:1fr}.expense-supplier-row{grid-template-columns:1fr}.expense-supplier-row .btn{width:100%}.expense-modal .inv-panel{width:min(96vw,720px);padding:18px}.inv-line{grid-template-columns:1fr .7fr .8fr 42px}.invoice-head{grid-template-columns:1fr}.invoice-paper{padding:14px;font-size:12px}}

<script type="module">
let createClient;
try{({createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm'))}
catch{({createClient}=await import('https://esm.sh/@supabase/supabase-js@2.57.0'))}
(function(){
const URL='https://bxibrptyonhxcdnizacp.supabase.co';
const KEY='sb_publishable_0bGaJhD7GxVh_UqaPAUFmA_PhR3ISMP';
const LOGO_DATA=location.origin+'/assets/garant-pg-nord-selected.svg';
const app=document.getElementById('app');
const db=createClient(URL,KEY);
const ALLOWED_IDS=['ceae49cb-4385-4052-a022-6aa0cea662ef','e29cfd4a-42cb-4c2b-a46c-cb7124ba7119','abdc2bea-ca10-44bc-ba47-fee7e280dcbe','f1ba2c98-124e-4b1e-8fe3-9f5b4aacecbb'];
const ALBARAN_ONLY_IDS=['f1ba2c98-124e-4b1e-8fe3-9f5b4aacecbb'];
const isAlbaranOnly=()=>ALBARAN_ONLY_IDS.includes(user?.id);
let token='';
let user=null, company=null, tab='overview';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const formatDateDMY=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:String(s)};
const countryName=code=>({ES:'España',EE:'Estonia',LT:'Lituania',LV:'Letonia',PT:'Portugal',DE:'Alemania',FR:'Francia',IT:'Italia',GB:'Reino Unido',NO:'Noruega'})[(code||'').toUpperCase()]||code||'';
const fullClientAddress=cl=>[cl.address,[cl.postal_code,cl.city].filter(Boolean).join(' '),countryName(cl.country_code)].filter(Boolean).join(', ');
async function req(path,opt={}){
 const {data,error}=await db.auth.getSession();
 if(error)throw error;token=data.session?.access_token||'';
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 if(token) headers.Authorization='Bearer '+token;
 const r=await fetch(URL+path,Object.assign({},opt,{headers}));
 const text=await r.text(); let result=null; try{result=text?JSON.parse(text):null}catch{result=text}
 if(!r.ok) throw new Error((result&&result.msg)||(result&&result.message)||(result&&result.error_description)||('HTTP '+r.status));
 return result;
}
function login(msg=''){
 app.innerHTML='<div class="wrap"><div class="card login"><h1>Бухгалтерия GARANT</h1><p>'+esc(msg||'Войдите через общий проект Garant. Доступ открыт только Роману и Катерине.')+'</p><a class="btn primary" href="/?section=accounting">Войти в Garant</a></div></div>';
}
async function boot(){
 const {data,error}=await db.auth.getSession();
 if(error||!data.session)return login();
 token=data.session.access_token;
 const verified=await db.auth.getUser();user=verified.data.user;
 if(verified.error||!user)return login('Сессия истекла. Войдите снова.');
 if(!ALLOWED_IDS.includes(user.id))return login('Нет доступа к этому разделу.');
 if(isAlbaranOnly())tab='albaranes';else{const requested=new URLSearchParams(location.search).get('tab');if(requested)tab=requested}
 try{
   const cs=await req('/rest/v1/acc_companies?select=*&limit=1');company=cs?.[0];
   if(!company)throw new Error('Компания недоступна');
   render();
 }catch(e){login('Ошибка загрузки: '+e.message)}
}

async function openQuickClient(onSaved){
 const m=document.createElement('div');m.className='inv-modal';
 m.innerHTML='<div class="inv-panel" style="max-width:720px"><div class="top"><div><h2 style="margin:0">Новый клиент</h2><div class="muted">Сразу доступен в Factura, Recargo и Albarán</div></div><button id="qcClose" class="btn">×</button></div>'+
 '<div class="inv-grid">'+
 '<div class="field"><label>Название / Имя *</label><input id="qcName"></div>'+
 '<div class="field"><label>NIF/CIF</label><input id="qcTax"></div>'+
 '<div class="field"><label>Адрес</label><input id="qcAddress"></div>'+
 '<div class="field"><label>Почтовый индекс</label><input id="qcPostal"></div>'+
 '<div class="field"><label>Город / провинция</label><input id="qcCity"></div>'+
 '<div class="field"><label>Страна</label><select id="qcCountry"><option value="ES">España</option><option value="PT">Portugal</option><option value="EE">Estonia</option><option value="FR">Francia</option><option value="DE">Alemania</option><option value="IT">Italia</option><option value="GB">Reino Unido</option><option value="NO">Noruega</option></select></div>'+
 '<div class="field"><label>Телефон</label><input id="qcPhone"></div>'+
 '<div class="field"><label>Email</label><input id="qcEmail" type="email"></div>'+
 '</div><div class="field"><label>Комментарий</label><input id="qcNotes"></div>'+
 '<div class="invoice-actions" style="justify-content:flex-end;margin-top:16px"><button id="qcSave" class="btn invoice-btn">Сохранить клиента</button></div></div>';
 document.body.appendChild(m);
 m.querySelector('#qcClose').onclick=()=>m.remove();
 m.querySelector('#qcSave').onclick=async()=>{
   const name=m.querySelector('#qcName').value.trim();
   if(!name)return alert('Введите название или имя клиента.');
   const payload={
     company_id:company.id,type:'customer',name,
     tax_id:m.querySelector('#qcTax').value.trim()||null,
     address:m.querySelector('#qcAddress').value.trim()||null,
     postal_code:m.querySelector('#qcPostal').value.trim()||null,
     city:m.querySelector('#qcCity').value.trim()||null,
     country_code:m.querySelector('#qcCountry').value||'ES',
     phone:m.querySelector('#qcPhone').value.trim()||null,
     email:m.querySelector('#qcEmail').value.trim()||null,
     notes:m.querySelector('#qcNotes').value.trim()||null
   };
   try{
     const rows=await req('/rest/v1/acc_counterparties',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});
     const saved=rows&&rows[0];
     m.remove();
     if(saved&&typeof onSaved==='function')onSaved(saved);
     else {tab='clients';render()}
   }catch(e){alert('Не удалось сохранить клиента: '+e.message)}
 };
}
function nav(){const items=isAlbaranOnly()?[['albaranes','Albaranes']]:[['overview','Обзор'],['sales','Продажи'],['incoming','Входящие счета'],['albaranes','Albaranes'],['expenses','Расходы'],['payments','Оплаты'],['clients','Клиенты'],['products','Товары'],['warehouse','Склад'],['catalog','Каталог']];return items.map(x=>'<button class="btn '+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('')}
function render(){app.innerHTML='<div class="wrap"><div class="top"><div class="brand"><img class="main-brand-logo" src="'+LOGO_DATA+'" alt="GARANT PG NORD"><div><h1>Бухгалтерия</h1><div class="muted">'+esc(company.legal_name||company.name)+'</div></div></div><div class="invoice-actions"><a class="btn" href="/">← Garant</a><button id="selfPassword" class="btn">Сменить свой пароль</button><button id="logout" class="btn">Выйти</button></div></div><div class="nav">'+nav()+'</div><div id="content"></div></div>';document.getElementById('logout').onclick=()=>{db.auth.signOut().then(()=>location.assign('/'))};document.getElementById('selfPassword').onclick=()=>changeOwnPassword();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});loadTab()}
function table(h,rows){return '<div style="overflow:auto"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'" class="muted">Пока нет записей</td></tr>')+'</tbody></table></div>'}
async function loadTab(){const c=document.getElementById('content');try{
 if(tab==='overview'){const [s,e,p]=await Promise.all([req('/rest/v1/acc_invoices?select=total,paid_total&company_id=eq.'+company.id+'&direction=eq.sale'),req('/rest/v1/acc_expenses?select=total_amount&company_id=eq.'+company.id),req('/rest/v1/acc_payments?select=amount,direction&company_id=eq.'+company.id)]);const sales=s.reduce((a,x)=>a+Number(x.total||0),0),paid=s.reduce((a,x)=>a+Number(x.paid_total||0),0),cost=e.reduce((a,x)=>a+Number(x.total_amount||0),0),cash=p.reduce((a,x)=>a+(x.direction==='in'?1:-1)*Number(x.amount||0),0);c.innerHTML='<div class="grid"><div class="card kpi"><span class="muted">Продажи</span><b>'+money(sales)+'</b></div><div class="card kpi"><span class="muted">Оплачено</span><b>'+money(paid)+'</b></div><div class="card kpi"><span class="muted">Расходы</span><b>'+money(cost)+'</b></div><div class="card kpi"><span class="muted">Денежный поток</span><b>'+money(cash)+'</b></div><button id="incomingTile" class="card" style="border:1px solid #e5e7eb;text-align:left;cursor:pointer;background:#fff"><span class="muted">Бухгалтерия</span><b style="font-size:22px;display:block;margin-top:8px">Входящие счета</b><span class="muted">Загрузить PDF/фото и передать главному бухгалтеру</span></button><button id="albaranTile" class="card" style="border:1px solid #e5e7eb;text-align:left;cursor:pointer;background:#fff"><span class="muted">Документы</span><b style="font-size:22px;display:block;margin-top:8px">Albaranes</b><span class="muted">Отгрузки по датам, отдельно от Factura</span></button><button id="writeoffTile" class="card" style="border:1px solid #e5e7eb;text-align:left;cursor:pointer;background:#fff"><span class="muted">Склад</span><b style="font-size:22px;display:block;margin-top:8px">Списание</b><span class="muted">Уменьшить остаток товара</span></button><button id="staffTile" class="card" style="border:1px solid #e5e7eb;text-align:left;cursor:pointer;background:#fff"><span class="muted">Управление</span><b style="font-size:22px;display:block;margin-top:8px">Доступ сотрудников</b><span class="muted">Роли и пароли сотрудников</span></button></div>';document.getElementById('incomingTile').onclick=()=>{tab='incoming';render()};document.getElementById('writeoffTile').onclick=()=>openWriteOff();document.getElementById('staffTile').onclick=()=>openStaffAccess();document.getElementById('albaranTile').onclick=()=>openAlbaranes();return}

 if(tab==='incoming'){
   const [rows,suppliers]=await Promise.all([
     req('/rest/v1/acc_incoming_invoices?select=*&company_id=eq.'+company.id+'&order=created_at.desc'),
     req('/rest/v1/acc_counterparties?select=id,name&company_id=eq.'+company.id+'&order=name')
   ]);
   const sm=Object.fromEntries(suppliers.map(x=>[x.id,x.name]));
   const statusLabel={pending_review:'На проверке',approved:'Подтверждён',paid:'Оплачен',rejected:'Отклонён'};
   c.innerHTML='<div class="card"><div class="top"><div><b>Входящие счета</b><div class="muted">PDF/фото для общей бухгалтерии и проверки главным бухгалтером</div></div><button id="newIncomingInvoice" class="btn invoice-btn">+ Загрузить входящий счёт</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Дата</th><th>Поставщик</th><th>№</th><th>Сумма</th><th>Срок оплаты</th><th>Статус</th><th>Файл</th><th></th></tr></thead><tbody>'+
   (rows.length?rows.map(x=>'<tr><td>'+esc(formatDateDMY(x.invoice_date))+'</td><td>'+esc(sm[x.supplier_id]||'—')+'</td><td>'+esc(x.invoice_number||'—')+'</td><td>'+esc(money(x.total_amount))+'</td><td>'+esc(formatDateDMY(x.due_date))+'</td><td>'+(x.status==='paid'?'<span class="status-ok">Оплачен</span>':x.status==='approved'?'<span class="status-ok">Подтверждён</span>':x.status==='rejected'?'<span class="status-wait">Отклонён</span>':'<span class="status-wait">На проверке</span>')+'</td><td>'+(x.file_path?'<button class="btn" data-open-incoming-file="'+x.id+'" data-path="'+esc(x.file_path)+'">Открыть</button>':'—')+'</td><td><div class="invoice-actions">'+
   (x.status==='pending_review'?'<button class="btn invoice-btn" data-incoming-status="'+x.id+'" data-status="approved">Подтвердить</button><button class="btn danger-btn" data-incoming-status="'+x.id+'" data-status="rejected">Отклонить</button>':'')+
   (x.status==='approved'?'<button class="btn invoice-btn" data-incoming-status="'+x.id+'" data-status="paid">Оплачен</button>':'')+
   '<button class="btn danger-btn" data-delete-incoming="'+x.id+'" data-path="'+esc(x.file_path||'')+'">Удалить</button></div></td></tr>').join(''):'<tr><td colspan="8" class="muted">Пока нет входящих счетов</td></tr>')+
   '</tbody></table></div></div>';
   document.getElementById('newIncomingInvoice').onclick=()=>openIncomingInvoiceForm();
   document.querySelectorAll('[data-open-incoming-file]').forEach(b=>b.onclick=()=>openIncomingInvoiceFile(b.dataset.path));
   document.querySelectorAll('[data-incoming-status]').forEach(b=>b.onclick=()=>setIncomingInvoiceStatus(b.dataset.incomingStatus,b.dataset.status));
   document.querySelectorAll('[data-delete-incoming]').forEach(b=>b.onclick=()=>deleteIncomingInvoice(b.dataset.deleteIncoming,b.dataset.path));
   return
 }
 if(tab==='albaranes'){openAlbaranes();return}

function nextAlbaranNumber(date,existing){
 const d=new Date(date+'T12:00:00'),dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=String(d.getFullYear()).slice(-2);
 const prefix='ALB-'+dd+mm+yy+'-';
 let max=0;(existing||[]).forEach(x=>{if((x.number||'').startsWith(prefix)){const n=parseInt((x.number||'').slice(prefix.length),10);if(n>max)max=n}});
 return prefix+String(max+1).padStart(2,'0');
}

     req('/rest/v1/acc_counterparties?select=id,name&company_id=eq.'+company.id)

   const m=document.createElement('div');m.className='inv-modal';
   m.innerHTML='<div class="inv-panel"><div class="top"><div><h2 style="margin:0">Albaranes</h2><div class="muted">Отгрузочные документы со своей датой и номером</div></div><div class="invoice-actions"><button id="newAlb" class="btn invoice-btn">+ Albarán</button><button id="closeAlb" class="btn">×</button></div></div>'+

   (docs.length?docs.map(x=>'<tr><td>'+esc(formatDateDMY(x.albaran_date))+'</td><td>'+esc(x.number||'—')+'</td><td>'+esc(cm[x.counterparty_id]||'—')+'</td><td>'+(x.invoice_id?'<span class="muted">связана</span>':'—')+'</td><td>'+esc(x.status||'—')+'</td><td><div class="invoice-actions"><button class="btn" data-alb-open="'+x.id+'">Открыть</button><button class="btn" data-alb-edit="'+x.id+'">Редактировать</button><button class="btn danger-btn" data-alb-del="'+x.id+'">Удалить</button></div></td></tr>').join(''):'<tr><td colspan="6" class="muted">Albaranes пока нет</td></tr>')+
   '</tbody></table></div></div>';
   document.body.appendChild(m);
   m.querySelector('#closeAlb').onclick=()=>m.remove();
   m.querySelector('#newAlb').onclick=()=>{m.remove();openAlbaranForm()};
   m.querySelectorAll('[data-alb-open]').forEach(b=>b.onclick=()=>openSavedAlbaran(b.dataset.albOpen));

async function openAlbaranForm(editId=null){
 try{
   const [clients,products,invoices,existing,currentRows,currentItems]=await Promise.all([
     req('/rest/v1/acc_counterparties?select=*&company_id=eq.'+company.id+'&type=in.(customer,both)&order=name'),
     req('/rest/v1/acc_products?select=id,name,flavor,sku,sale_price&company_id=eq.'+company.id+'&active=eq.true&order=flavor'),
     req('/rest/v1/acc_invoices?select=id,number,invoice_date,counterparty_id,subtotal,vat_total,recargo_rate,recargo_total,total&company_id=eq.'+company.id+'&direction=eq.sale&order=invoice_date.desc'),
     req('/rest/v1/acc_albaranes?select=id,number,albaran_date&company_id=eq.'+company.id),
     editId?req('/rest/v1/acc_albaranes?select=*&id=eq.'+editId+'&limit=1'):Promise.resolve([]),
     editId?req('/rest/v1/acc_albaran_items?select=*&albaran_id=eq.'+editId+'&order=id.asc'):Promise.resolve([])
   ]);
   const current=currentRows[0]||null;
   const today=current?.albaran_date||new Date().toISOString().slice(0,10);
   const number=current?.number||nextAlbaranNumber(today,existing);
   const m=document.createElement('div');m.className='inv-modal';
   m.innerHTML='<div class="inv-panel"><div class="top"><div><h2 style="margin:0">'+(editId?'Редактировать Albarán':'Новый Albarán')+'</h2><div class="muted">Дата и номер Albarán не зависят от Factura</div></div><button id="albFormClose" class="btn">×</button></div>'+
   '<div class="inv-grid"><div class="field"><label>Дата Albarán</label><input id="albDate" type="date" value="'+today+'"></div><div class="field"><label>№ Albarán</label><input id="albNumber" value="'+esc(number)+'" '+(editId?'':'readonly')+'></div>'+
   '<div class="field"><label>Клиент</label><div style="display:flex;gap:8px;align-items:center"><select id="albClient" style="flex:1"><option value="">Выберите клиента</option>'+clients.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select><button id="albNewClient" type="button" class="btn">+ Новый клиент</button></div></div>'+
   '<div class="field"><label>Factura (необязательно)</label><select id="albInvoice"><option value="">Без привязки к Factura</option>'+invoices.map(x=>'<option value="'+x.id+'">'+esc(x.invoice_date+' — '+x.number)+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>IVA</label><input id="albVat" type="number" step="0.1" value="'+Number(current?.vat_rate??21)+'"></div>'+
   '<div class="field"><label>Recargo</label><input id="albRec" type="number" step="0.1" value="'+Number(current?.recargo_rate??0)+'"></div></div>'+
   '<div class="invoice-actions" style="margin:8px 0 12px"><button id="loadFactItems" class="btn">Загрузить товары и суммы из Factura</button></div>'+
   '<div><b>Mercancía</b><div id="albLines"></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #d1d5db"><b>Всего банок</b><b id="albQuantity">0</b></div><button id="addAlbLine" class="btn">+ Добавить позицию</button></div>'+
   '<div class="inv-summary"><span>Subtotal</span><b id="albSub">0,00 €</b><span>IVA</span><b id="albVatTotal">0,00 €</b><span>Recargo</span><b id="albRecTotal">0,00 €</b><span class="grand">TOTAL</span><b class="grand" id="albTotal">0,00 €</b></div>'+
   '<div class="field"><label>Комментарий</label><input id="albNotes" value="'+esc(current?.notes||'')+'"></div>'+
   '<div class="invoice-actions" style="justify-content:flex-end;margin-top:16px"><button id="saveAlb" class="btn invoice-btn">Сохранить Albarán</button></div></div>';
   document.body.appendChild(m);
   if(current){m.querySelector('#albClient').value=current.counterparty_id;m.querySelector('#albInvoice').value=current.invoice_id||''}
   const lines=m.querySelector('#albLines');

   function recalc(){
     let sub=0,quantity=0;
     m.querySelectorAll('.inv-line').forEach(r=>{const q=Number(r.querySelector('.aq').value||0);quantity+=q;sub+=q*Number(r.querySelector('.aprice').value||0)});
     m.querySelector('#albQuantity').textContent=quantity.toLocaleString('ru-RU');
     const vr=Number(m.querySelector('#albVat').value||0), rr=Number(m.querySelector('#albRec').value||0);
     const iva=sub*vr/100, rec=sub*rr/100, total=sub+iva+rec;
     m.querySelector('#albSub').textContent=money(sub);
     m.querySelector('#albVatTotal').textContent=money(iva);
     m.querySelector('#albRecTotal').textContent=money(rec);
     m.querySelector('#albTotal').textContent=money(total);
     return {sub,vr,rr,iva,rec,total};
   }
   function addLine(item=null){
     const r=document.createElement('div');r.className='inv-line';
     r.innerHTML='<div class="field"><label>Товар</label><select class="ap">'+products.map(p=>'<option value="'+p.id+'" data-price="'+Number(p.sale_price||0)+'">'+esc((p.flavor||p.name)+(p.sku?' — '+p.sku:''))+'</option>').join('')+'</select></div>'+
       '<div class="field"><label>Cantidad</label><input class="aq" type="number" min="0.001" step="1" value="'+Number(item?.quantity||1)+'"></div>'+
       '<div class="field"><label>Precio</label><input class="aprice" type="number" min="0" step="0.01" value="'+Number(item?.unit_price??0).toFixed(2)+'"></div>'+
       '<button class="btn ar">×</button>';
     lines.appendChild(r);
     if(item?.product_id&&products.some(p=>p.id===item.product_id))r.querySelector('.ap').value=item.product_id;
     if(!item?.unit_price){
       const sel=r.querySelector('.ap');r.querySelector('.aprice').value=Number(sel.selectedOptions[0]?.dataset.price||0).toFixed(2);
     }
     r.querySelector('.ap').onchange=()=>{r.querySelector('.aprice').value=Number(r.querySelector('.ap').selectedOptions[0]?.dataset.price||0).toFixed(2);recalc()};
     r.querySelector('.aq').oninput=recalc;r.querySelector('.aprice').oninput=recalc;r.querySelector('.ar').onclick=()=>{r.remove();recalc()};recalc();
   }
   if(currentItems.length)currentItems.forEach(addLine);else addLine();

   m.querySelector('#albFormClose').onclick=()=>m.remove();
   m.querySelector('#albNewClient').onclick=()=>openQuickClient(saved=>{
     clients.push(saved);
     const sel=m.querySelector('#albClient');

function nextInvoiceNumber(existing){
 const now=new Date(), dd=String(now.getDate()).padStart(2,'0'), mm=String(now.getMonth()+1).padStart(2,'0'), yy=String(now.getFullYear()).slice(-2);
 const prefix=dd+'-'+mm+yy+'/';
 let max=0;(existing||[]).forEach(x=>{if((x.number||'').startsWith(prefix)){const n=parseInt((x.number||'').split('/').pop(),10);if(n>max)max=n}});
 return prefix+String(max+1).padStart(2,'0');
}

let pdfLibraryPromise;
function loadPdfLibrary(){
 if(window.html2pdf)return Promise.resolve(window.html2pdf);
 if(!pdfLibraryPromise)pdfLibraryPromise=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
   script.onload=()=>window.html2pdf?resolve(window.html2pdf):reject(new Error('Библиотека PDF недоступна'));
   script.onerror=()=>{script.remove();reject(new Error('Не удалось загрузить библиотеку PDF. Проверьте интернет и повторите.'))};
   document.head.appendChild(script);
 }).catch(error=>{pdfLibraryPromise=null;throw error});
 return pdfLibraryPromise;
}
async function downloadAlbaranPdf(paper,number,button){

   const html2pdf=await loadPdfLibrary();
   host=document.createElement('div');
   host.style.cssText='position:fixed;left:0;top:0;width:794px;z-index:-1;pointer-events:none;background:white';
   const clone=paper.cloneNode(true);clone.removeAttribute('id');
   clone.style.cssText='width:794px;max-width:none;margin:0;padding:26px;background:white;color:#111;font:12px Arial,sans-serif';
   host.appendChild(clone);
   const style=document.createElement('style');
   style.textContent='.pdf-albaran .invoice-head{grid-template-columns:1.4fr .8fr}.pdf-albaran tr,.pdf-albaran .invoice-total-box,.pdf-albaran .invoice-footer{break-inside:avoid}';
   host.className='pdf-albaran';host.appendChild(style);document.body.appendChild(host);
   await Promise.all(Array.from(clone.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})));
   if(document.fonts?.ready)await document.fonts.ready;
   const filename='Albaran_'+String(number||'documento').replace(/[^a-zA-Z0-9_-]/g,'_')+'.pdf';
   await html2pdf().set({margin:8,filename,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:1024},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(clone).save();
 }catch(e){alert('Не удалось скачать PDF: '+e.message+' Можно воспользоваться кнопкой «Печать».')}
 finally{host?.remove();button.disabled=false;button.textContent=label}
}

       '<div class="field"><label>Способ оплаты</label><select id="exMethod"><option value="bank">Банк</option><option value="cash">Наличные</option><option value="card">Карта</option><option value="other">Другое</option></select></div>'+
       '<div class="field field-full"><label>Описание *</label><input id="exDesc" placeholder="Например, топливо, аренда, курьер"></div>'+
       '<div class="field field-full"><label>Комментарий</label><input id="exNotes"></div>'+
     '</div>',
     async d=>{
       const net=Number(d.querySelector('#exNet').value||0);
       const vatRate=Number(d.querySelector('#exVatRate').value||0);
       let vat=Number(d.querySelector('#exVat').value||0);
       let total=Number(d.querySelector('#exTotal').value||0);
       const desc=d.querySelector('#exDesc').value.trim();
       if(!desc)return alert('Введите описание расхода.');
       if(vat===0&&net>0&&vatRate>0)vat=net*vatRate/100;
       if(total===0)total=net+vat;
       try{
         await req('/rest/v1/acc_expenses',{
           method:'POST',
           headers:{Prefer:'return=representation'},
           body:JSON.stringify({
             company_id:company.id,
             category_id:d.querySelector('#exCategory').value||null,
             supplier_id:d.querySelector('#exSupplier').value||null,
             expense_date:d.querySelector('#exDate').value,
             description:desc,
             net_amount:net,
             vat_rate:vatRate,
             vat_amount:vat,
             total_amount:total,
             payment_method:d.querySelector('#exMethod').value,
             document_number:d.querySelector('#exDoc').value.trim()||null,
             notes:d.querySelector('#exNotes').value.trim()||null,
             created_by:user.id
           })
         });
         d.remove();
         await loadTab();
       }catch(e){alert('Не удалось сохранить расход: '+e.message)}
     }
   );
   setTimeout(()=>{
     const net=document.getElementById('exNet'),vr=document.getElementById('exVatRate'),vat=document.getElementById('exVat'),tot=document.getElementById('exTotal');
     const recalc=()=>{const n=Number(net?.value||0),r=Number(vr?.value||0),v=n*r/100;if(vat)vat.value=v.toFixed(2);if(tot)tot.value=(n+v).toFixed(2)};
     if(net)net.oninput=recalc;if(vr)vr.oninput=recalc;
     const addSupplier=document.getElementById('exAddSupplier');
     if(addSupplier)addSupplier.onclick=()=>openQuickSupplier(saved=>{
       const sel=document.getElementById('exSupplier');
       if(sel&&saved){
         const o=document.createElement('option');o.value=saved.id;o.textContent=saved.name;sel.appendChild(o);sel.value=saved.id;
       }
     });
     const addCategory=document.getElementById('exAddCategory');
     if(addCategory)addCategory.onclick=()=>openQuickExpenseCategory(saved=>{
       const sel=document.getElementById('exCategory');
       if(sel&&saved){
         const o=document.createElement('option');o.value=saved.id;o.textContent=saved.name;sel.appendChild(o);sel.value=saved.id;
       }
     });
   },0);
 }catch(e){alert('Не удалось открыть форму расхода: '+e.message)}
}

async function openInventoryCount(){
 try{
   const [products,warehouses,moves]=await Promise.all([
     req('/rest/v1/acc_products?select=id,sku,name,flavor&company_id=eq.'+company.id+'&active=eq.true&order=flavor'),
     req('/rest/v1/acc_warehouses?select=id,name,type&company_id=eq.'+company.id+'&order=name'),
     req('/rest/v1/acc_stock_movements?select=product_id,warehouse_id,movement_type,quantity&company_id=eq.'+company.id)
   ]);
   const mainWarehouse=warehouses.find(w=>w.type==='main')||warehouses[0];
   if(!mainWarehouse)return alert('Общий склад не найден.');
   const balances={};
   moves.forEach(m=>{
     if(m.warehouse_id!==mainWarehouse.id)return;
     const sign=(m.movement_type==='out'||m.movement_type==='transfer_out')?-1:1;
     balances[m.product_id]=(balances[m.product_id]||0)+sign*Number(m.quantity||0);
   });
   const d=document.createElement('div');d.className='inv-modal';
   d.innerHTML='<div class="inv-panel" style="max-width:900px"><div class="top"><div><h2 style="margin:0">Инвентаризация общего склада</h2><div class="muted">Введите фактическое количество. Система скорректирует только разницу.</div></div><button id="icClose" class="btn">×</button></div>'+
   '<div style="overflow:auto;margin-top:14px"><table class="table"><thead><tr><th>Товар</th><th>SKU</th><th>По программе</th><th>Фактически</th><th>Разница</th></tr></thead><tbody>'+
   products.map(p=>{const cur=Number(balances[p.id]||0);return '<tr data-ic-row="'+p.id+'"><td>'+esc((p.flavor||p.name||'').replace(/^Classic\s+/i,''))+'</td><td>'+esc(p.sku||'—')+'</td><td class="ic-current" data-current="'+cur+'">'+cur+'</td><td><input class="ic-actual" type="number" min="0" step="1" value="'+cur+'" style="width:110px;padding:8px;border:1px solid #d1d5db;border-radius:9px"></td><td class="ic-diff">0</td></tr>'}).join('')+
   '</tbody></table></div><div class="invoice-actions" style="justify-content:flex-end;margin-top:16px"><button id="icSave" class="btn invoice-btn">Сохранить фактический остаток</button></div></div>';
   document.body.appendChild(d);
   const refresh=()=>d.querySelectorAll('[data-ic-row]').forEach(r=>{const cur=Number(r.querySelector('.ic-current').dataset.current||0),act=Number(r.querySelector('.ic-actual').value||0),diff=act-cur;r.querySelector('.ic-diff').textContent=(diff>0?'+':'')+diff});
   d.querySelectorAll('.ic-actual').forEach(i=>i.oninput=refresh);refresh();
   d.querySelector('#icClose').onclick=()=>d.remove();
   d.querySelector('#icSave').onclick=async()=>{
     const corrections=[];
     d.querySelectorAll('[data-ic-row]').forEach(r=>{
       const product_id=r.dataset.icRow,cur=Number(r.querySelector('.ic-current').dataset.current||0),actual=Number(r.querySelector('.ic-actual').value||0),diff=actual-cur;
       if(actual<0)return;
       if(diff!==0)corrections.push({product_id,diff,actual,cur});
     });
     if(!corrections.length){alert('Расхождений нет. Остатки уже совпадают.');return}
     if(!confirm('Сохранить инвентаризацию?\n\nБудет скорректировано позиций: '+corrections.length))return;
     try{
       const rows=corrections.map(x=>({
         company_id:company.id,
         product_id:x.product_id,
         warehouse_id:mainWarehouse.id,
         movement_type:x.diff>0?'in':'out',
         quantity:Math.abs(x.diff),
         reference_type:'physical_inventory',
         note:'Инвентаризация: было '+x.cur+', фактически '+x.actual,
         created_by:user.id
       }));
       await req('/rest/v1/acc_stock_movements',{method:'POST',body:JSON.stringify(rows)});
       d.remove();
       alert('Инвентаризация сохранена. Общий склад приведён к фактическому остатку.');
       await loadTab();
     }catch(e){alert('Не удалось сохранить инвентаризацию: '+e.message)}
   };
 }catch(e){alert('Не удалось открыть инвентаризацию: '+e.message)}
}

async function openWriteOff(){
 try{
   const [products,warehouses,moves]=await Promise.all([
     req('/rest/v1/acc_products?select=id,sku,name,flavor,unit_weight_g&company_id=eq.'+company.id+'&active=eq.true&order=flavor'),
     req('/rest/v1/acc_warehouses?select=id,name,type&company_id=eq.'+company.id+'&order=name'),
     req('/rest/v1/acc_stock_movements?select=product_id,warehouse_id,movement_type,quantity&company_id=eq.'+company.id)
   ]);
   if(!products.length)return alert('Нет товаров для списания.');
   if(!warehouses.length)return alert('Нет склада.');
   const mainWarehouse=warehouses.find(w=>w.type==='main')||warehouses[0];
   if(!mainWarehouse)return alert('Общий склад не найден.');
   const balances={};
   moves.forEach(m=>{const k=m.product_id+'|'+m.warehouse_id;const sign=(m.movement_type==='out'||m.movement_type==='transfer_out')?-1:1;balances[k]=(balances[k]||0)+sign*Number(m.quantity||0)});
   const po=products.map(p=>'<option value="'+p.id+'">'+esc((p.flavor||p.name)+(p.sku?' — '+p.sku:''))+'</option>').join('');
   dialogBox('Списание товара',
     '<div class="field"><label>Товар</label><select id="woprod" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px">'+po+'</select></div>'+
     '<div class="field"><label>Склад</label><input value="'+esc(mainWarehouse.name)+'" disabled><div class="muted">Списание всегда уменьшает остаток общего склада.</div></div>'+
     '<div id="wobal" class="muted" style="margin:-4px 0 8px"></div>'+
     '<div class="field"><label>Количество банок</label><input id="woqty" type="number" min="1" step="1"></div>'+
     '<div class="field"><label>Причина списания</label><input id="woreason" placeholder="Брак, образцы, повреждение, другое"></div>',
     async d=>{
       const pid=d.querySelector('#woprod').value,wid=mainWarehouse.id,qty=Number(d.querySelector('#woqty').value||0),reason=d.querySelector('#woreason').value.trim();
       const available=balances[pid+'|'+wid]||0;
       if(qty<=0)return alert('Введите количество банок.');
       if(qty>available)return alert('Недостаточно товара. Остаток: '+available+' банок.');
       if(!reason)return alert('Укажите причину списания.');
       try{
         await req('/rest/v1/acc_stock_movements',{method:'POST',body:JSON.stringify({
           company_id:company.id,product_id:pid,warehouse_id:wid,movement_type:'out',quantity:qty,
           reference_type:'writeoff',note:'Списание: '+reason,created_by:user.id
         })});
         d.remove();
         alert('Списание сохранено: '+qty+' банок.');
         loadTab();
       }catch(e){alert('Не удалось списать товар: '+e.message)}
     }
   );
   setTimeout(()=>{
     const ps=document.getElementById('woprod'),out=document.getElementById('wobal');
     const refresh=()=>{if(ps&&out)out.textContent='Доступно на общем складе: '+(balances[ps.value+'|'+mainWarehouse.id]||0)+' банок';};
     if(ps)ps.onchange=refresh;refresh();
   },0);
 }catch(e){alert(e.message)}
}

function createMovement(products,warehouses){
 if(!products.length)return alert('Сначала добавьте товар в разделе «Товары».');
 if(!warehouses.length)return alert('Сначала добавьте склад.');
 const po=products.map(p=>'<option value="'+p.id+'">'+esc(p.name+' '+(p.flavor||''))+'</option>').join('');
 const wo=warehouses.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('');
 dialogBox('Движение товара',
 '<div class="field"><label>Товар</label><select id="mvprod" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px">'+po+'</select></div>'+
 '<div class="field"><label>Склад</label><select id="mvwh" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px">'+wo+'</select></div>'+
 '<div class="field"><label>Тип</label><select id="mvtype" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px"><option value="in">Приход</option><option value="out">Расход</option><option value="adjustment">Корректировка +</option></select></div>'+
 '<div class="field"><label>Количество банок</label><input id="mvqty" type="number" min="1" step="1"></div><div id="mvweight" class="muted" style="margin-top:-6px;margin-bottom:8px"></div>'+
 '<div class="field"><label>Комментарий</label><input id="mvnote" placeholder="Например, поступление партии"></div>',
 async d=>{
   const qty=Number(d.querySelector('#mvqty').value||0); if(qty<=0)return alert('Введите количество');
   const prod=products.find(p=>p.id===d.querySelector('#mvprod').value);
   try{
     await req('/rest/v1/acc_stock_movements',{method:'POST',body:JSON.stringify({
       company_id:company.id,
       product_id:d.querySelector('#mvprod').value,
       warehouse_id:d.querySelector('#mvwh').value,
       movement_type:d.querySelector('#mvtype').value,
       quantity:qty,
       note:d.querySelector('#mvnote').value,
       created_by:user.id
     })});
     d.remove();loadTab();
   }catch(e){alert(e.message)}
 });
 setTimeout(()=>{
   const psel=document.getElementById('mvprod'), qinp=document.getElementById('mvqty'), out=document.getElementById('mvweight');
   const refresh=()=>{if(!psel||!qinp||!out)return;const p=products.find(x=>x.id===psel.value);const q=Number(qinp.value||0);const g=q*Number(p?.unit_weight_g||0);out.textContent=g?('Вес: '+g.toLocaleString('ru-RU')+' г ('+(g/1000).toLocaleString('ru-RU',{maximumFractionDigits:3})+' кг)'):'У товара не указан вес одной банки';};
   if(psel)psel.onchange=refresh;if(qinp)qinp.oninput=refresh;refresh();
 },0);
}
boot();
})();
