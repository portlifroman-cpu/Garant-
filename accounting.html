<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827;background:#f5f7fb}

.inv-modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:12px;z-index:10000}.inv-panel{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.inv-line{display:grid;grid-template-columns:2fr .65fr .8fr 42px;gap:8px;align-items:end;margin:8px 0}.inv-line select,.inv-line input,.inv-panel select,.inv-panel input{width:100%;padding:10px;border:1px solid #cfd8df;border-radius:10px;background:#fff}.inv-summary{margin-left:auto;width:min(360px,100%);display:grid;grid-template-columns:1fr auto;gap:7px 12px;padding-top:12px}.inv-summary .grand{font-weight:800;font-size:18px}.invoice-paper{background:#fff;color:#111;font-family:Arial,sans-serif;max-width:850px;margin:0 auto;padding:26px}.invoice-head{display:grid;grid-template-columns:1.4fr .8fr;gap:26px;align-items:start}.invoice-title{color:#0a5c73;font-size:22px;font-weight:800;border-bottom:4px solid #0a5c73;padding-bottom:6px;margin:18px 0}.invoice-client-label,.invoice-pay-label{display:inline-block;color:#0a5c73;font-weight:700;border-bottom:3px solid #0a5c73;padding:0 26px 4px 2px}.invoice-box{border:1px solid #333}.invoice-box div{display:flex;justify-content:space-between;gap:16px;padding:5px 8px;border-bottom:1px solid #aaa}.invoice-box div:last-child{border-bottom:0}.invoice-table{width:100%;border-collapse:collapse;margin-top:14px;border:2px solid #222}.invoice-table th,.invoice-table td{border-right:1px solid #222;padding:7px 5px}.invoice-table th{color:#0a5c73;border-bottom:2px solid #222}.invoice-table th:last-child,.invoice-table td:last-child{border-right:0}.invoice-table .amount{text-align:right}.invoice-total-box{margin-left:auto;width:310px;border-collapse:collapse}.invoice-total-box td{padding:5px 8px;border-bottom:1px solid #222}.invoice-total-box td:last-child{text-align:right;background:#f1eff8;border-left:1px solid #222}.invoice-footer{display:flex;justify-content:space-between;gap:24px;border-bottom:4px solid #0a5c73;padding-bottom:16px;margin-top:8px}.invoice-sign{text-align:right;margin-top:34px;font-style:italic}

</style></head><body><div id="app"><div class="wrap"><div class="card login"><div class="brand"><div class="logo">G</div><div><h1>GARANT Бухгалтерия</h1><div class="muted">Загрузка…</div></div></div></div></div></div>
<script>
(function(){
const URL='https://ohifwlyioempwulgtaqq.supabase.co';
const KEY='sb_publishable_w7udKh87hKvHxbIbQl3LxA_oCd5TKvd';
const app=document.getElementById('app');
let token=localStorage.getItem('garant_accounting_token')||'';
let user=null, company=null, tab='overview';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function req(path,opt={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 if(token) headers.Authorization='Bearer '+token;
 const r=await fetch(URL+path,Object.assign({},opt,{headers}));
 const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{data=text}
 if(!r.ok) throw new Error((data&&data.msg)||(data&&data.message)||(data&&data.error_description)||('HTTP '+r.status));
 return data;
}
function login(msg=''){app.innerHTML='<div class="wrap"><div class="card login"><div class="brand"><div class="logo">G</div><div><h1>GARANT Бухгалтерия</h1><div class="muted">PG Nord Garant S.L.</div></div></div>'+(msg?'<div class="notice">'+esc(msg)+'</div>':'')+'<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"></div><button id="signin" class="btn primary full">Войти</button><button id="reg" class="btn full">Создать аккаунт</button></div></div>';document.getElementById('signin').onclick=signin;document.getElementById('reg').onclick=register}
async function signin(){
 const email=document.getElementById('email').value.trim(), password=document.getElementById('pass').value;
 if(!email||!password)return login('Введите email и пароль.');
 try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});token=d.access_token;localStorage.setItem('garant_accounting_token',token);await boot()}catch(e){login('Ошибка входа: '+e.message)}
}
function register(){app.innerHTML='<div class="wrap"><div class="card login"><h1>Регистрация</h1><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Пароль</label><input id="rp" type="password"></div><div class="field"><label>Повторите пароль</label><input id="rp2" type="password"></div><button id="do" class="btn primary full">Зарегистрироваться</button><button id="back" class="btn full">Назад</button></div></div>';document.getElementById('back').onclick=()=>login();document.getElementById('do').onclick=signup}
async function signup(){const email=document.getElementById('re').value.trim(),p=document.getElementById('rp').value,p2=document.getElementById('rp2').value;if(!email.includes('@'))return alert('Введите корректный email');if(p.length<6)return alert('Пароль минимум 6 символов');if(p!==p2)return alert('Пароли не совпадают');try{await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:p,data:{},gotrue_meta_security:{captcha_token:''}})});login('Аккаунт создан. Если email уже подтверждён — просто войдите. Если придёт письмо, подтвердите адрес.')}catch(e){login('Ошибка регистрации: '+e.message)}}
async function boot(){
 if(!token)return login();
 try{user=await req('/auth/v1/user');}
 catch(e){localStorage.removeItem('garant_accounting_token');token='';return login('Сессия истекла. Войдите снова.')}
 try{
   const cs=await req('/rest/v1/companies?select=*&limit=1');
   company=cs&&cs[0];
   if(!company)return setup();
   render();
 }catch(e){login('Ошибка загрузки данных: '+e.message)}
}
function setup(){app.innerHTML='<div class="wrap"><div class="card login"><h1>Первичная настройка</h1><div class="field"><label>Компания</label><input id="cn" value="PG Nord Garant S.L."></div><div class="field"><label>NIF</label><input id="tx" value="B26984146"></div><button id="create" class="btn primary full">Создать компанию</button></div></div>';document.getElementById('create').onclick=createCompany}
async function createCompany(){try{const rows=await req('/rest/v1/companies',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name:'GARANT',legal_name:document.getElementById('cn').value,tax_id:document.getElementById('tx').value,created_by:user.id})});company=rows[0];await req('/rest/v1/memberships',{method:'POST',body:JSON.stringify({company_id:company.id,user_id:user.id,role:'owner'})});await req('/rest/v1/warehouses',{method:'POST',body:JSON.stringify({company_id:company.id,name:'Главный склад',type:'main'})});render()}catch(e){alert(e.message)}}
function nav(){return [['overview','Обзор'],['sales','Продажи'],['expenses','Расходы'],['payments','Оплаты'],['clients','Клиенты'],['products','Товары'],['warehouse','Склад'],['catalog','Каталог']].map(x=>'<button class="btn '+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('')}
function render(){app.innerHTML='<div class="wrap"><div class="top"><div class="brand"><div class="logo">G</div><div><h1>GARANT Бухгалтерия</h1><div class="muted">'+esc(company.legal_name||company.name)+'</div></div></div><button id="logout" class="btn">Выйти</button></div><div class="nav">'+nav()+'</div><div id="content"></div></div>';document.getElementById('logout').onclick=()=>{localStorage.removeItem('garant_accounting_token');token='';login()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});loadTab()}
function table(h,rows){return '<div style="overflow:auto"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'" class="muted">Пока нет записей</td></tr>')+'</tbody></table></div>'}
async function loadTab(){const c=document.getElementById('content');try{
 if(tab==='overview'){const [s,e,p]=await Promise.all([req('/rest/v1/invoices?select=total,paid_total&company_id=eq.'+company.id+'&direction=eq.sale'),req('/rest/v1/expenses?select=total_amount&company_id=eq.'+company.id),req('/rest/v1/payments?select=amount,direction&company_id=eq.'+company.id)]);const sales=s.reduce((a,x)=>a+Number(x.total||0),0),paid=s.reduce((a,x)=>a+Number(x.paid_total||0),0),cost=e.reduce((a,x)=>a+Number(x.total_amount||0),0),cash=p.reduce((a,x)=>a+(x.direction==='in'?1:-1)*Number(x.amount||0),0);c.innerHTML='<div class="grid"><div class="card kpi"><span class="muted">Продажи</span><b>'+money(sales)+'</b></div><div class="card kpi"><span class="muted">Оплачено</span><b>'+money(paid)+'</b></div><div class="card kpi"><span class="muted">Расходы</span><b>'+money(cost)+'</b></div><div class="card kpi"><span class="muted">Денежный поток</span><b>'+money(cash)+'</b></div></div>';return}
 if(tab==='sales'){
   const d=await req('/rest/v1/invoices?select=id,invoice_date,number,status,total,paid_total&company_id=eq.'+company.id+'&direction=eq.sale&order=invoice_date.desc');
   c.innerHTML='<div class="card"><div class="top"><div><b>Продажи / счета</b><div class="muted">Счета PG Nord Garant S.L.</div></div><button id="newinvoice" class="btn invoice-btn">+ Выставить счёт</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Дата</th><th>№</th><th>Статус</th><th>Сумма</th><th>Оплачено</th><th></th></tr></thead><tbody>'+(d.length?d.map(x=>'<tr><td>'+esc(x.invoice_date||'—')+'</td><td>'+esc(x.number||'—')+'</td><td>'+esc(x.status||'—')+'</td><td>'+esc(money(x.total))+'</td><td>'+esc(money(x.paid_total))+'</td><td><button class="btn" data-invoice="'+x.id+'">Открыть</button></td></tr>').join(''):'<tr><td colspan="6" class="muted">Пока нет счетов</td></tr>')+'</tbody></table></div></div>';
   document.getElementById('newinvoice').onclick=()=>openInvoiceForm();
   document.querySelectorAll('[data-invoice]').forEach(b=>b.onclick=()=>openSavedInvoice(b.dataset.invoice));
   return
 }
 if(tab==='expenses'){const d=await req('/rest/v1/expenses?select=expense_date,description,total_amount,vat_amount,document_number&company_id=eq.'+company.id+'&order=expense_date.desc');c.innerHTML='<div class="card"><b>Расходы</b>'+table(['Дата','Описание','Документ','IVA','Всего'],d.map(x=>[x.expense_date||'—',x.description,x.document_number||'—',money(x.vat_amount),money(x.total_amount)]))+'</div>';return}
 if(tab==='payments'){const d=await req('/rest/v1/payments?select=payment_date,direction,method,amount,reference&company_id=eq.'+company.id+'&order=payment_date.desc');c.innerHTML='<div class="card"><b>Оплаты</b>'+table(['Дата','Тип','Способ','Сумма','Комментарий'],d.map(x=>[x.payment_date||'—',x.direction==='in'?'Входящая':'Исходящая',x.method,money(x.amount),x.reference||'—']))+'</div>';return}
 if(tab==='clients'){const d=await req('/rest/v1/counterparties?select=*&company_id=eq.'+company.id+'&order=name');c.innerHTML='<div class="card"><b>Клиенты и поставщики</b>'+table(['Название','Тип','NIF/CIF','Телефон','Город'],d.map(x=>[x.name,x.type,x.tax_id||'—',x.phone||'—',x.city||'—']))+'</div>';return}
 if(tab==='catalog'){
   c.innerHTML='<div class="card"><b>Каталог GARANT</b><div class="muted">Загружаю актуальные товары и изображения с сайта…</div></div>';
   try{
     const endpoint='https://bxibrptyonhxcdnizacp.supabase.co/functions/v1/public-catalog-products';
     const proxy='https://bxibrptyonhxcdnizacp.supabase.co/functions/v1/official-garant-product-image';
     const rr=await fetch(endpoint);
     if(!rr.ok)throw new Error('Каталог временно недоступен');
     const jj=await rr.json();
     const items=Array.isArray(jj.products)?jj.products:[];
     const groups={};
     items.forEach(x=>{const g=x.category||'Другое';(groups[g]||(groups[g]=[])).push(x)});
     c.innerHTML=Object.entries(groups).map(([group,arr])=>'<div class="card" style="margin-bottom:12px"><h2 style="font-size:18px;margin:0 0 12px">'+esc(group)+'</h2><div class="catalog-grid">'+arr.map(x=>{const img=x.image_url||(x.source_url?(proxy+'?url='+encodeURIComponent(x.source_url)):'');return '<div class="product-card"><h3>'+esc(x.name)+'</h3>'+(img?'<img src="'+esc(img)+'" alt="'+esc(x.name)+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<div class="product-meta">'+(x.flavor?'<div>Вкус: '+esc(x.flavor)+'</div>':'')+(x.strength?'<div>Крепость: '+esc(x.strength)+'</div>':'')+(x.total_weight_g?'<div>Вес: '+esc(x.total_weight_g)+' г</div>':'')+(x.pouches_per_can?'<div>Порций: '+esc(x.pouches_per_can)+'</div>':'')+(x.product_type?'<div>Тип: '+esc(x.product_type)+'</div>':'')+'</div></div>'}).join('')+'</div></div>').join('');
     if(!items.length)c.innerHTML='<div class="notice">Каталог пока пуст.</div>';
   }catch(e){c.innerHTML='<div class="notice">Не удалось загрузить каталог: '+esc(e.message)+'</div>'}
   return
 }
 if(tab==='warehouse'){
   const [products,warehouses,moves]=await Promise.all([
     req('/rest/v1/products?select=id,sku,name,flavor,unit_weight_g&company_id=eq.'+company.id+'&order=name'),
     req('/rest/v1/warehouses?select=id,name,type&company_id=eq.'+company.id+'&order=name'),
     req('/rest/v1/stock_movements?select=product_id,warehouse_id,movement_type,quantity,movement_at,note&company_id=eq.'+company.id+'&order=movement_at.desc')
   ]);
   const balances={};
   for(const m of moves){
     const k=m.product_id+'|'+m.warehouse_id;
     const s=(m.movement_type==='out'||m.movement_type==='transfer_out')?-1:1;
     balances[k]=(balances[k]||0)+s*Number(m.quantity||0);
   }
   const rows=[];
   for(const w of warehouses){for(const p of products){const q=balances[p.id+'|'+w.id]||0;if(q!==0){const grams=q*Number(p.unit_weight_g||0);rows.push([w.name,p.name,p.flavor||'—',p.sku||'—',q,grams?grams.toLocaleString('ru-RU')+' г':'—',grams?(grams/1000).toLocaleString('ru-RU',{maximumFractionDigits:3})+' кг':'—']);}}}
   c.innerHTML='<div class="card"><div class="top"><div><b>Склад</b><div class="muted">Остатки по складам</div></div><div><button id="addwh" class="btn">+ Склад</button> <button id="addmove" class="btn primary">+ Движение</button></div></div>'+table(['Склад','Товар','Вкус','SKU','Банки','Вес, г','Вес, кг'],rows)+'</div><div class="card" style="margin-top:12px"><b>Последние движения</b>'+table(['Дата','Тип','Количество','Комментарий'],moves.slice(0,20).map(x=>[x.movement_at||'—',x.movement_type,x.quantity,x.note||'—']))+'</div>';
   document.getElementById('addwh').onclick=()=>createWarehouse();
   document.getElementById('addmove').onclick=()=>createMovement(products,warehouses);
   return
 }
 if(tab==='products'){const d=await req('/rest/v1/products?select=*&company_id=eq.'+company.id+'&order=name');c.innerHTML='<div class="card"><b>Товары / вкусы</b>'+table(['SKU','Название','Вкус','Вес 1 банки','Закупка','Продажа','IVA'],d.map(x=>[x.sku||'—',x.name,x.flavor||'—',(x.unit_weight_g?Number(x.unit_weight_g).toLocaleString('ru-RU')+' г':'—'),money(x.purchase_price),money(x.sale_price),(x.vat_rate||0)+'%']))+'</div>';return}
}catch(e){c.innerHTML='<div class="notice">Ошибка загрузки: '+esc(e.message)+'</div>'}}


function nextInvoiceNumber(existing){
 const now=new Date(), dd=String(now.getDate()).padStart(2,'0'), mm=String(now.getMonth()+1).padStart(2,'0'), yy=String(now.getFullYear()).slice(-2);
 const prefix=dd+'-'+mm+yy+'/';
 let max=0;(existing||[]).forEach(x=>{if((x.number||'').startsWith(prefix)){const n=parseInt((x.number||'').split('/').pop(),10);if(n>max)max=n}});
 return prefix+String(max+1).padStart(2,'0');
}
async function openInvoiceForm(){
 try{
   const [clients,products,existing]=await Promise.all([
     req('/rest/v1/counterparties?select=*&company_id=eq.'+company.id+'&type=in.(customer,both)&order=name'),
     req('/rest/v1/products?select=id,name,flavor,sale_price,vat_rate&company_id=eq.'+company.id+'&active=eq.true&order=flavor'),
     req('/rest/v1/invoices?select=number&company_id=eq.'+company.id+'&direction=eq.sale')
   ]);
   if(!clients.length)return alert('Сначала добавьте клиента в разделе «Клиенты».');
   if(!products.length)return alert('Нет товаров для счёта.');
   const number=nextInvoiceNumber(existing);
   const today=new Date().toISOString().slice(0,10);
   const modal=document.createElement('div');modal.className='inv-modal';
   modal.innerHTML='<div class="inv-panel"><div class="top"><div><h2 style="margin:0">Новый счёт</h2><div class="muted">В стиле вашего образца FACTURA</div></div><button id="invclose" class="btn">×</button></div>'+
   '<div class="inv-grid"><div class="field"><label>Клиент</label><select id="invclient">'+clients.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>№ Factura</label><input id="invnumber" value="'+esc(number)+'"></div><div class="field"><label>Fecha</label><input id="invdate" type="date" value="'+today+'"></div><div class="field"><label>Forma de Pago</label><select id="invpay"><option value="cash">En efectivo</option><option value="bank">Transferencia bancaria</option><option value="card">Tarjeta</option><option value="other">Otro</option></select></div><div class="field"><label>IVA</label><input id="invat" type="number" step="0.1" value="21"></div><div class="field"><label>Recargo de equivalencia</label><input id="invrec" type="number" step="0.1" value="5.2"></div></div>'+
   '<div style="margin-top:12px"><b>Mercancía</b><div id="invlines"></div><button id="addline" class="btn">+ Добавить позицию</button></div>'+
   '<div class="inv-summary"><span>Subtotal</span><b id="sumsub">0,00 €</b><span>IVA</span><b id="sumiva">0,00 €</b><span>Recargo</span><b id="sumrec">0,00 €</b><span class="grand">TOTAL</span><b class="grand" id="sumtotal">0,00 €</b></div>'+
   '<div class="invoice-actions" style="justify-content:flex-end;margin-top:16px"><button id="previewinvoice" class="btn">Предпросмотр</button><button id="saveinvoice" class="btn invoice-btn">Сохранить счёт</button></div></div>';
   document.body.appendChild(modal);
   const lines=modal.querySelector('#invlines');
   function addLine(){
     const row=document.createElement('div');row.className='inv-line';
     row.innerHTML='<div class="field"><label>Товар</label><select class="lp">'+products.map(p=>'<option value="'+p.id+'" data-price="'+Number(p.sale_price||0)+'">'+esc((p.flavor||p.name))+'</option>').join('')+'</select></div><div class="field"><label>Cantidad</label><input class="lq" type="number" min="1" step="1" value="1"></div><div class="field"><label>Precio unidad</label><input class="lu" type="number" min="0" step="0.01" value="'+Number(products[0].sale_price||0).toFixed(2)+'"></div><button class="btn lr">×</button>';
     lines.appendChild(row);
     const sel=row.querySelector('.lp'),price=row.querySelector('.lu');
     sel.onchange=()=>{price.value=Number(sel.selectedOptions[0].dataset.price||0).toFixed(2);recalc()};
     row.querySelector('.lq').oninput=recalc;price.oninput=recalc;row.querySelector('.lr').onclick=()=>{row.remove();recalc()};recalc();
   }
   function recalc(){
     let sub=0;modal.querySelectorAll('.inv-line').forEach(r=>sub+=Number(r.querySelector('.lq').value||0)*Number(r.querySelector('.lu').value||0));
     const vr=Number(modal.querySelector('#invat').value||0), rr=Number(modal.querySelector('#invrec').value||0), iva=sub*vr/100, rec=sub*rr/100,total=sub+iva+rec;
     modal.querySelector('#sumsub').textContent=money(sub);modal.querySelector('#sumiva').textContent=money(iva);modal.querySelector('#sumrec').textContent=money(rec);modal.querySelector('#sumtotal').textContent=money(total);
     return {sub,vr,rr,iva,rec,total};
   }
   modal.querySelector('#invat').oninput=recalc;modal.querySelector('#invrec').oninput=recalc;
   modal.querySelector('#addline').onclick=addLine;modal.querySelector('#invclose').onclick=()=>modal.remove();addLine();
   modal.querySelector('#previewinvoice').onclick=()=>{const pack=collect();if(pack)showInvoicePaper(pack,false)};
   modal.querySelector('#saveinvoice').onclick=async()=>{const pack=collect();if(!pack)return;try{
      const invRows=await req('/rest/v1/invoices',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({company_id:company.id,counterparty_id:pack.client.id,direction:'sale',number:pack.number,status:'issued',invoice_date:pack.date,subtotal:pack.totals.sub,vat_total:pack.totals.iva,recargo_rate:pack.totals.rr,recargo_total:pack.totals.rec,total:pack.totals.total,paid_total:0,payment_method:pack.payment,created_by:user.id})});
      const inv=invRows[0];
      await req('/rest/v1/invoice_items',{method:'POST',body:JSON.stringify(pack.items.map(i=>({company_id:company.id,invoice_id:inv.id,product_id:i.product_id,description:i.description,quantity:i.quantity,unit_price:i.unit_price,vat_rate:pack.totals.vr,excise_per_unit:0,line_subtotal:i.subtotal,line_vat:i.subtotal*pack.totals.vr/100,line_excise:0,line_total:i.subtotal*(1+pack.totals.vr/100)})))});
      modal.remove();showInvoicePaper(Object.assign(pack,{id:inv.id}),true);loadTab();
   }catch(e){alert('Не удалось сохранить счёт: '+e.message)}};
   function collect(){
     const client=clients.find(x=>x.id===modal.querySelector('#invclient').value), items=[];
     modal.querySelectorAll('.inv-line').forEach(r=>{const p=products.find(x=>x.id===r.querySelector('.lp').value),q=Number(r.querySelector('.lq').value||0),u=Number(r.querySelector('.lu').value||0);if(q>0)items.push({product_id:p.id,description:(p.flavor||p.name),quantity:q,unit_price:u,subtotal:q*u})});
     if(!items.length){alert('Добавьте хотя бы одну позицию');return null}
     return {client,number:modal.querySelector('#invnumber').value.trim(),date:modal.querySelector('#invdate').value,payment:modal.querySelector('#invpay').value,items,totals:recalc()};
   }
 }catch(e){alert(e.message)}
}

 }catch(e){alert(e.message)}

function dialogBox(title,body,onSave){
 const d=document.createElement('div');
 d.style.position='fixed';d.style.inset='0';d.style.background='rgba(0,0,0,.35)';d.style.display='grid';d.style.placeItems='center';d.style.padding='16px';d.style.zIndex='9999';
 d.innerHTML='<div class="card" style="width:min(480px,100%);max-height:90vh;overflow:auto"><h3 style="margin-top:0">'+title+'</h3>'+body+'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="cancelDlg" class="btn">Отмена</button><button id="saveDlg" class="btn primary">Сохранить</button></div></div>';
 document.body.appendChild(d);

 d.querySelector('#saveDlg').onclick=()=>onSave(d);
}
