<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GARANT Бухгалтерия</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:22px;margin:0}.muted{color:#6b7280;font-size:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(17,24,39,.05)}
.login{max-width:430px;margin:10vh auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#6b7280}.field input,.field select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:#e9edf4}.btn.primary{background:#111827;color:#fff}.btn.full{width:100%;margin-top:8px}
.notice{padding:10px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{font-size:27px;display:block;margin-top:6px}.nav{display:flex;gap:8px;overflow:auto;margin:14px 0}.nav button{white-space:nowrap}.nav button.active{background:#111827;color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eef0f3;text-align:left;font-size:14px}.table th{font-size:12px;color:#6b7280}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}h1{font-size:19px}}
</style></head><body><div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const supabase=createClient('https://ohifwlyioempwulgtaqq.supabase.co','sb_publishable_w7udKh87hKvHxbIbQl3LxA_oCd5TKvd');
const app=document.getElementById('app');let user=null,company=null,tab='overview';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'}).format(Number(n||0));
const date=d=>d?new Date(d).toLocaleDateString('ru-RU'):'—';
function login(msg=''){app.innerHTML='<div class="wrap"><div class="card login"><div class="brand"><div class="logo">G</div><div><h1>GARANT Бухгалтерия</h1><div class="muted">PG Nord Garant S.L.</div></div></div>'+ (msg?'<div class="notice">'+msg+'</div>':'') +'<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Пароль</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn primary full" id="signin">Войти</button><button class="btn full" id="openreg">Регистрация нового аккаунта</button></div></div>';document.getElementById('signin').onclick=signin;document.getElementById('openreg').onclick=()=>registerView()}

function registerView(msg=''){app.innerHTML='<div class="wrap"><div class="card login"><div class="brand"><div class="logo">G</div><div><h1>Создание аккаунта</h1><div class="muted">GARANT Бухгалтерия</div></div></div>'+ (msg?'<div class="notice">'+msg+'</div>':'') +'<div class="field"><label>Email</label><input id="regemail" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>Пароль</label><input id="regpass" type="password" autocomplete="new-password" placeholder="Минимум 6 символов"></div><div class="field"><label>Повторите пароль</label><input id="regpass2" type="password" autocomplete="new-password"></div><button class="btn primary full" id="dosignup">ЗАРЕГИСТРИРОВАТЬСЯ</button><button class="btn full" id="backlogin">Назад ко входу</button></div></div>';document.getElementById('dosignup').onclick=signup;document.getElementById('backlogin').onclick=()=>login()}
async function signin(){const email=document.getElementById('email').value, password=document.getElementById('pass').value;const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return login(error.message);boot()}
async function signup(){
 const email=(document.getElementById('regemail')?.value||'').trim();
 const password=document.getElementById('regpass')?.value||'';
 const password2=document.getElementById('regpass2')?.value||'';
 if(!email || !email.includes('@')) return registerView('Введите корректный email.');
 if(password.length<6) return registerView('Пароль должен содержать минимум 6 символов.');
 if(password!==password2) return registerView('Пароли не совпадают.');
 const btn=document.getElementById('dosignup'); if(btn){btn.disabled=true;btn.textContent='Создаю аккаунт...';}
 const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:'https://garantkartaprodazhcloud.vercel.app/buhgalteria.html'}});
 if(error){
   const m=error.message||'Ошибка регистрации';
   return registerView('Ошибка регистрации: '+m);
 }
 if(data?.session){return boot();}
 login('Аккаунт создан. Проверьте почту: нужно подтвердить email, затем войти.');
}
async function boot(){const {data}=await supabase.auth.getUser();user=data.user;if(!user)return login();const {data:cs}=await supabase.from('companies').select('*').limit(1);company=cs?.[0];if(!company)return setup();render()}
function setup(){app.innerHTML='<div class="wrap"><div class="card login"><h1>Первичная настройка</h1><div class="muted">Создадим компанию в бухгалтерии</div><div class="field"><label>Компания</label><input id="company" value="PG Nord Garant S.L."></div><div class="field"><label>NIF</label><input id="tax" value="B26984146"></div><button class="btn primary full" id="create">Создать</button></div></div>';document.getElementById('create').onclick=async()=>{const {data:c,error}=await supabase.from('companies').insert({name:'GARANT',legal_name:document.getElementById('company').value,tax_id:document.getElementById('tax').value,created_by:user.id}).select().single();if(error)return alert(error.message);await supabase.from('memberships').insert({company_id:c.id,user_id:user.id,role:'owner'});await supabase.from('warehouses').insert({company_id:c.id,name:'Главный склад',type:'main'});company=c;render()}}
async function render(){app.innerHTML='<div class="wrap"><div class="top"><div class="brand"><div class="logo">G</div><div><h1>GARANT Бухгалтерия</h1><div class="muted">'+(company.legal_name||company.name)+'</div></div></div><button class="btn" id="logout">Выйти</button></div><div class="nav">'+[['overview','Обзор'],['sales','Продажи'],['expenses','Расходы'],['payments','Оплаты'],['clients','Клиенты'],['products','Товары']].map(([a,b])=>'<button class="btn '+(tab===a?'active':'')+'" data-tab="'+a+'">'+b+'</button>').join('')+'</div><div id="content"></div></div>';document.getElementById('logout').onclick=()=>supabase.auth.signOut().then(()=>login());document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});load()}
function table(h,rows){return '<div style="overflow:auto"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'" class="muted">Пока нет записей</td></tr>')+'</tbody></table></div>'}
async function load(){const c=document.getElementById('content');if(tab==='overview'){const [si,ex,pa]=await Promise.all([supabase.from('invoices').select('total,paid_total').eq('company_id',company.id).eq('direction','sale'),supabase.from('expenses').select('total_amount').eq('company_id',company.id),supabase.from('payments').select('amount,direction').eq('company_id',company.id)]);const sales=(si.data||[]).reduce((a,x)=>a+Number(x.total),0),paid=(si.data||[]).reduce((a,x)=>a+Number(x.paid_total),0),cost=(ex.data||[]).reduce((a,x)=>a+Number(x.total_amount),0),cash=(pa.data||[]).reduce((a,x)=>a+(x.direction==='in'?1:-1)*Number(x.amount),0);c.innerHTML='<div class="grid"><div class="card kpi"><span class="muted">Продажи</span><b>'+money(sales)+'</b></div><div class="card kpi"><span class="muted">Оплачено</span><b>'+money(paid)+'</b></div><div class="card kpi"><span class="muted">Расходы</span><b>'+money(cost)+'</b></div><div class="card kpi"><span class="muted">Денежный поток</span><b>'+money(cash)+'</b></div></div><div class="card" style="margin-top:14px"><b>GARANT Бухгалтерия</b><p class="muted">Отдельный проект для учёта продаж, оплат, расходов, клиентов, товаров, IVA и складских движений.</p></div>';return}
if(tab==='sales'){const {data=[]}=await supabase.from('invoices').select('invoice_date,number,status,total,paid_total,counterparties(name)').eq('company_id',company.id).eq('direction','sale').order('invoice_date',{ascending:false});c.innerHTML='<div class="card"><b>Продажи / счета</b>'+table(['Дата','№','Клиент','Статус','Сумма','Оплачено'],data.map(x=>[date(x.invoice_date),x.number||'—',x.counterparties?.name||'—',x.status,money(x.total),money(x.paid_total)]))+'</div>';return}
if(tab==='expenses'){const {data=[]}=await supabase.from('expenses').select('expense_date,description,total_amount,vat_amount,document_number').eq('company_id',company.id).order('expense_date',{ascending:false});c.innerHTML='<div class="card"><b>Расходы</b>'+table(['Дата','Описание','Документ','IVA','Всего'],data.map(x=>[date(x.expense_date),x.description,x.document_number||'—',money(x.vat_amount),money(x.total_amount)]))+'</div>';return}
if(tab==='payments'){const {data=[]}=await supabase.from('payments').select('payment_date,direction,method,amount,reference').eq('company_id',company.id).order('payment_date',{ascending:false});c.innerHTML='<div class="card"><b>Оплаты</b>'+table(['Дата','Тип','Способ','Сумма','Комментарий'],data.map(x=>[date(x.payment_date),x.direction==='in'?'Входящая':'Исходящая',x.method,money(x.amount),x.reference||'—']))+'</div>';return}
if(tab==='clients'){const {data=[]}=await supabase.from('counterparties').select('*').eq('company_id',company.id).order('name');c.innerHTML='<div class="card"><b>Клиенты и поставщики</b>'+table(['Название','Тип','NIF/CIF','Телефон','Город'],data.map(x=>[x.name,x.type,x.tax_id||'—',x.phone||'—',x.city||'—']))+'</div>';return}
if(tab==='products'){const {data=[]}=await supabase.from('products').select('*').eq('company_id',company.id).order('name');c.innerHTML='<div class="card"><b>Товары / вкусы</b>'+table(['SKU','Название','Вкус','Закупка','Продажа','IVA'],data.map(x=>[x.sku||'—',x.name,x.flavor||'—',money(x.purchase_price),money(x.sale_price),x.vat_rate+'%']))+'</div>';return}}
supabase.auth.onAuthStateChange(()=>boot());boot();
</script></body></html>
